# Application
spring.application.name=ride-service
server.port=8082

# Database
spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.moeialhyzfqcindyduwd
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ?? Resilience4j Circuit Breaker ?????????????????????????
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.sliding-window-size=5
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.userService.automatic-transition-from-open-to-half-open-enabled=true

# ?? Resilience4j Retry ???????????????????????????????????
resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=2s
resilience4j.retry.instances.userService.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException,feign.FeignException.ServiceUnavailable

# ?? Resilience4j Timeout ?????????????????????????????????
resilience4j.timelimiter.instances.userService.timeout-duration=5s

# ?? Feign Timeout (underlying HTTP) ??????????????????????
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# ?? Actuator (expose circuit breaker health) ?????????????
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ?? Logging ??????????????????????????????????????????????
logging.level.io.github.resilience4j=DEBUG
logging.level.com.rideshare.rideservice=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

# ?? Enable Feign + Circuit Breaker integration ??????????
spring.cloud.openfeign.circuitbreaker.enabled=true